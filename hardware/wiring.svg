<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi 3 B+ and Camera Module 3 connections</title>
  <desc id="desc">Micro-USB power enters the Pi. A 15-pin CSI ribbon connects the camera. A microSD card stores the OS and logs. A laptop connects over a local network for SSH.</desc>
  <rect width="1000" height="570" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="40" y="48" font-size="26" font-weight="bold">Inventory camera connections</text>
    <text x="40" y="78" font-size="16">Pi 3 B+ / Camera Module 3 • connector-level diagram</text>
    <rect x="40" y="145" width="225" height="100" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="60" y="180" font-size="19" font-weight="bold">Micro-USB supply</text>
    <text x="60" y="210" font-size="17">5 V-class / 2.5 A</text>
    <rect x="370" y="135" width="270" height="240" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="395" y="175" font-size="23" font-weight="bold">Raspberry Pi 3 B+</text>
    <text x="395" y="215" font-size="17">Micro-USB PWR IN</text>
    <text x="395" y="260" font-size="17">CAMERA / CSI socket</text>
    <text x="395" y="305" font-size="17">microSD slot underneath</text>
    <text x="395" y="345" font-size="17">Wi-Fi / Ethernet</text>
    <rect x="755" y="210" width="205" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="775" y="248" font-size="20" font-weight="bold">Camera Module 3</text>
    <text x="775" y="280" font-size="17">Standard / autofocus</text>
    <rect x="40" y="305" width="225" height="80" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="60" y="337" font-size="19" font-weight="bold">128 GB microSD</text>
    <text x="60" y="365" font-size="16">Raspberry Pi OS + CSV logs</text>
    <rect x="370" y="455" width="270" height="70" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="395" y="485" font-size="19" font-weight="bold">Laptop / desktop</text>
    <text x="395" y="510" font-size="16">SSH on the local network</text>
    <path d="M265 195 H370" stroke="#6366f1" stroke-width="5" fill="none"/>
    <path d="M640 260 H755" stroke="#2563eb" stroke-width="8" fill="none"/>
    <text x="657" y="216" font-size="15">15-to-15-pin</text>
    <text x="661" y="238" font-size="15">CSI ribbon</text>
    <path d="M265 345 H320 V300 H370" stroke="#b45309" stroke-width="3" fill="none"/>
    <path d="M505 375 V455" stroke="#64748b" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
    <text x="525" y="420" font-size="15">Wi-Fi or Ethernet</text>
    <text x="40" y="555" font-size="15">Unplug power before adjusting the ribbon. Camera power and data both use CSI; GPIO is unused.</text>
  </g>
</svg>
